[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-service-specs"
dynamic = ["version"]
description = "A service contract for Django: declare an operation's parameters, permission check, validation and output once, and dispatch it from any transport."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "services", "service-layer", "specs", "dispatch", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Django is the base, and the only one: no DRF, here or in any group below,
    # because dispatch without DRF is the reason the package exists and a test
    # environment with DRF installed could not notice the kernel reaching for
    # it. The floor matches djangorestframework-services', which will depend on
    # this package, so it cannot be raised past what that package supports.
    "django>=4.2",
]

[project.optional-dependencies]
pydantic = [
    # For the pydantic adapter, and imported by nothing else. The floor is the
    # first release with ``validate_by_alias``: a model can then validate by
    # field name, and the adapter reads that setting to name each parameter
    # for the key the model accepts. Below it the setting is silently ignored,
    # so the declared name would be one pydantic refuses.
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/Artui/django-service-specs"
Repository = "https://github.com/Artui/django-service-specs"
Issues = "https://github.com/Artui/django-service-specs/issues"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.32",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    # Backs the ``TID`` rule selection below; ruff reads its settings from the
    # flake8-tidy-imports namespace and the plugin is what defines them.
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.1.0",
    # The adapter's tests; the floor is the extra's, for the same reason.
    "pydantic>=2.11",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_service_specs"]

[tool.hatch.version]
path = "django_service_specs/version.py"
# Hatchling's default regex expects a bare ``__version__ = "..."``. This file
# annotates the assignment, so the pattern has to allow the annotation or the
# build cannot find the version at all.
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=django_service_specs --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["django_service_specs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E203", "E501", "E231", "F811", "E722", "E741", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_service_specs"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
root = ["./django_service_specs"]

[tool.bumpversion]
current_version = "0.1.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_service_specs/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-service-specs/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-service-specs/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-service-specs/compare/v{current_version}...v{new_version}"""
